# Contract for uart_tx.s: 8N1 frames, LSB first, exact bit timing.
program: uart_tx.s
assume:
  P: {min: 8, max: 65535}          # bit period B in cycles, written by the host
  initial: {B0: 0}                 # external level of the TX pin before the program drives it
  tx_fifo:                         # two symbolic bytes with symbolic arrival cycles
    - {data: d0, at: a0}           # (0 <= a0 <= a1): covers back-to-back and after-idle frames
    - {data: d1, at: a1}
guarantee:
  never: [LATE, UNF, HALT]
  pin: B0
  idle: {level: 1, from: 1}        # high from cycle 1 on, except inside frames
  frames:
    for_each: tx_fifo
    start: {within: 5}             # start bit within 5 cycles of max(previous end, arrival)
    length: "10*P"
    waveform:
      - {from: 0, to: P, level: 0}                                   # start bit
      - {from: "k*P", to: "(k+1)*P", level: "d[k-1]", k: "1..8"}     # data, LSB first
      - {from: "9*P", to: "10*P", level: 1}                          # stop bit
bounds: {frames: 2}
