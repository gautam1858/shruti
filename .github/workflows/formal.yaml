name: formal

on:
  push:
  workflow_dispatch:

jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Install OSS CAD Suite (Yosys, SymbiYosys, solvers)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove the Event Machine properties (k-induction)
        run: cd verify && sby -f em.sby prove

      - name: Every cover statement is reachable
        run: cd verify && sby -f em.sby cover

      - name: Every planted bug fails the bounded check
        run: |
          echo "## Formal: planted bugs" >> $GITHUB_STEP_SUMMARY
          python3 verify/mutate.py | tee -a $GITHUB_STEP_SUMMARY

      - name: upload SBY logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formal-logs
          path: verify/em_*/**/*.txt
