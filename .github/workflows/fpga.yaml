name: fpga

on:
  push:
  workflow_dispatch:

jobs:
  tangnano20k:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the open Gowin toolchain (Yosys, nextpnr-himbaechel, Apicula)
        run: pip install yowasp-yosys yowasp-nextpnr-himbaechel-gowin apycula

      - name: Build the Tang Nano 20K bitstream
        run: sh fpga/tangnano20k/build.sh

      - name: Utilisation and timing
        run: |
          echo "## Tang Nano 20K" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "LUT4:|DFF:|ALU:|IOB:|Max frequency" fpga/tangnano20k/out/pnr.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: upload bitstream and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tangnano20k
          path: |
            fpga/tangnano20k/out/shruti.fs
            fpga/tangnano20k/out/*.log
