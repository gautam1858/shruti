# Tiny Tapeout project information
project:
  title:        "Shruti"
  author:       "Gautam Ramachandra"
  discord:      ""
  description:  "Event-native protocol emulator with an on-die protocol identifier (UART, SPI, I2C; low-speed USB and 10BASE-T stretch)"
  language:     "Verilog"
  clock_hz:     50000000

  # Jane Street protocol emulator ASIC competition allocation (see the competition brief).
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_gautam1858_shruti"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
# This is the target pinout from the architecture spec; milestone 0 uses ui[1:0] as the filter-mode select.
pinout:
  # Inputs
  ui[0]: "HOST_SCK (host SPI clock)"
  ui[1]: "HOST_MOSI (host SPI data in)"
  ui[2]: "HOST_CS_N (host SPI chip select)"
  ui[3]: "TRIG_IN (external trigger)"
  ui[4]: "M0 (monitor-only bus pin)"
  ui[5]: "M1 (monitor-only bus pin)"
  ui[6]: "M2 (monitor-only bus pin)"
  ui[7]: "M3 (monitor-only bus pin)"

  # Outputs
  uo[0]: "HOST_MISO (host SPI data out)"
  uo[1]: "IRQ"
  uo[2]: "TRIG_OUT (trigger to scope)"
  uo[3]: "EAR_CONF (identifier confident)"
  uo[4]: "EAR_CLASS0 (identified protocol, bit 0)"
  uo[5]: "EAR_CLASS1 (identified protocol, bit 1)"
  uo[6]: "EAR_CLASS2 (identified protocol, bit 2)"
  uo[7]: "EAR_OOD (traffic not recognised)"

  # Bidirectional pins
  uio[0]: "B0 (bus pin, push-pull or open-drain)"
  uio[1]: "B1 (bus pin)"
  uio[2]: "B2 (bus pin)"
  uio[3]: "B3 (bus pin)"
  uio[4]: "B4 (bus pin)"
  uio[5]: "B5 (bus pin)"
  uio[6]: "B6 (bus pin)"
  uio[7]: "B7 (bus pin)"

# Do not change!
yaml_version: 6
